<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Gift boxes, a pine tree and gold garland on a cream background">
  <!-- Original vector illustration for the Holiday Gift Finder homepage hero. -->
  <!-- Palette: pine #0E3B2E, gold #D4A94E, cream #FFF6DC, warm red #C0392B (gifts only). No people, no mascots, no stock art. -->
  <rect width="1200" height="600" fill="#FFF6DC"/>
  <circle cx="820" cy="300" r="230" fill="#F8EFC9"/>

  <!-- garland swag across the top -->
  <path d="M0 40 Q150 92 300 40 Q450 92 600 40 Q750 92 900 40 Q1050 92 1200 40" fill="none" stroke="#D4A94E" stroke-width="3"/>
  <g>
    <path d="M104 62 L136 62 L120 98 Z" fill="#C0392B"/>
    <path d="M224 74 L256 74 L240 110 Z" fill="#0E3B2E"/>
    <path d="M344 62 L376 62 L360 98 Z" fill="#D4A94E"/>
    <path d="M464 74 L496 74 L480 110 Z" fill="#C0392B"/>
    <path d="M584 62 L616 62 L600 98 Z" fill="#0E3B2E"/>
    <path d="M704 74 L736 74 L720 110 Z" fill="#D4A94E"/>
    <path d="M824 62 L856 62 L840 98 Z" fill="#C0392B"/>
    <path d="M944 74 L976 74 L960 110 Z" fill="#0E3B2E"/>
    <path d="M1064 62 L1096 62 L1080 98 Z" fill="#D4A94E"/>
  </g>

  <!-- pine tree, left -->
  <g>
    <rect x="170" y="420" width="20" height="70" fill="#092A20"/>
    <path d="M180 150 L105 320 L255 320 Z" fill="#0E3B2E"/>
    <path d="M180 240 L90 400 L270 400 Z" fill="#0E3B2E"/>
    <path d="M180 330 L75 480 L285 480 Z" fill="#0E3B2E"/>
    <!-- star on top -->
    <path d="M180 128 L186 146 L204 146 L190 157 L195 175 L180 164 L165 175 L170 157 L156 146 L174 146 Z" fill="#D4A94E"/>
    <!-- ornaments -->
    <circle cx="150" cy="270" r="7" fill="#D4A94E"/>
    <circle cx="205" cy="300" r="7" fill="#C0392B"/>
    <circle cx="140" cy="370" r="7" fill="#C0392B"/>
    <circle cx="215" cy="390" r="7" fill="#D4A94E"/>
    <circle cx="180" cy="330" r="7" fill="#D4A94E"/>
    <circle cx="125" cy="440" r="7" fill="#D4A94E"/>
    <circle cx="235" cy="450" r="7" fill="#C0392B"/>
    <circle cx="180" cy="430" r="7" fill="#C0392B"/>
  </g>

  <!-- ground shadows -->
  <ellipse cx="670" cy="508" rx="270" ry="14" fill="#F8EFC9"/>
  <ellipse cx="180" cy="495" rx="120" ry="10" fill="#F8EFC9"/>

  <!-- small gold gift box -->
  <g>
    <rect x="440" y="410" width="110" height="90" rx="8" fill="#D4A94E"/>
    <rect x="432" y="392" width="126" height="22" rx="4" fill="#0E3B2E"/>
    <rect x="487" y="392" width="16" height="108" fill="#0E3B2E"/>
    <path d="M495 392c-14-17-34-4-22 8 7 7 22 1 22-8z" fill="#0E3B2E"/>
    <path d="M495 392c14-17 34-4 22 8-7 7-22 1-22-8z" fill="#0E3B2E"/>
  </g>

  <!-- big red gift box -->
  <g>
    <rect x="560" y="330" width="220" height="170" rx="8" fill="#C0392B"/>
    <rect x="545" y="305" width="250" height="30" rx="4" fill="#A93226"/>
    <rect x="655" y="305" width="30" height="195" fill="#D4A94E"/>
    <path d="M670 305c-24-28-56-6-36 13 11 11 36 2 36-13z" fill="#D4A94E"/>
    <path d="M670 305c24-28 56-6 36 13-11 11-36 2-36-13z" fill="#D4A94E"/>
  </g>

  <!-- pine gift box -->
  <g>
    <rect x="810" y="380" width="170" height="120" rx="8" fill="#0E3B2E"/>
    <rect x="798" y="358" width="194" height="26" rx="4" fill="#092A20"/>
    <rect x="880" y="358" width="24" height="142" fill="#D4A94E"/>
    <path d="M892 358c-18-21-42-5-27 10 8 8 27 2 27-10z" fill="#D4A94E"/>
    <path d="M892 358c18-21 42-5 27 10-8 8-27 2-27-10z" fill="#D4A94E"/>
  </g>

  <!-- small pine gift box, far right -->
  <g>
    <rect x="1010" y="430" width="90" height="70" rx="8" fill="#0E3B2E"/>
    <rect x="1003" y="414" width="104" height="20" rx="4" fill="#D4A94E"/>
    <rect x="1047" y="414" width="14" height="86" fill="#D4A94E"/>
  </g>

  <!-- confetti dots and stars -->
  <g fill="#D4A94E">
    <circle cx="340" cy="170" r="5"/><circle cx="430" cy="140" r="5"/><circle cx="520" cy="180" r="5"/>
    <circle cx="1050" cy="180" r="5"/><circle cx="1120" cy="260" r="5"/><circle cx="380" cy="250" r="5"/>
    <circle cx="1010" cy="330" r="5"/><circle cx="60" cy="180" r="5"/><circle cx="90" cy="300" r="5"/>
  </g>
  <g fill="#C0392B">
    <circle cx="380" cy="200" r="4"/><circle cx="480" cy="250" r="4"/><circle cx="1080" cy="220" r="4"/>
    <circle cx="330" cy="330" r="4"/><circle cx="1150" cy="380" r="4"/>
  </g>
  <g fill="#D4A94E">
    <path d="M950 150 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
    <path d="M420 130 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z"/>
    <path d="M1130 140 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z"/>
  </g>

  <!-- pine sprigs, bottom corners -->
  <g stroke="#0E3B2E" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M30 570 L70 540 L110 570"/>
    <path d="M50 558 L50 540 M70 548 L70 528 M90 558 L90 540"/>
    <path d="M1090 570 L1130 540 L1170 570"/>
    <path d="M1110 558 L1110 540 M1130 548 L1130 528 M1150 558 L1150 540"/>
  </g>
</svg>
