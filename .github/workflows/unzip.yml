name: Unzip site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site files
        run: |
          set -e
          if [ ! -f merry-printables-site.zip ]; then echo "No zip found, nothing to do"; exit 0; fi
          mkdir -p /tmp/site
          unzip -o merry-printables-site.zip -d /tmp/site
          SRC=/tmp/site
          if [ ! -f "$SRC/index.html" ]; then
            DIRS=$(find "$SRC" -mindepth 1 -maxdepth 1 -type d)
            COUNT=$(echo "$DIRS" | wc -l)
            if [ "$COUNT" = "1" ] && [ -f "$DIRS/index.html" ]; then SRC="$DIRS"; fi
          fi
          echo "Source: $SRC"
          ls -la "$SRC"
          cp -a "$SRC"/. .
          rm -rf /tmp/site
          rm -f merry-printables-site.zip build_site.py OPERATIONS.md DEPLOY.md
          rm -rf .github
          ls -la
          git config user.name "hanxianqing"
          git config user.email "hanxianqing@users.noreply.github.com"
          git status --short
          git add -A
          git commit -m "Deploy site files from zip" || echo "Nothing to commit"
          git push
