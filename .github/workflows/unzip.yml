name: Unzip site archive
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and clean up
        run: |
          unzip -o merry-printables-site.zip -d .
          rm merry-printables-site.zip
          rm .github/workflows/unzip.yml
      - name: Commit extracted files
        run: |
          git config user.name "hanxianqing"
          git config user.email "hanxianqing@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Merry Printables v2" || echo "No changes to commit"
          git push
