name: Unzip giftfinder site

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unzip-giftfinder.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site into giftfinder
        run: |
          set -e
          unzip -o giftfinder/giftfinder-site.zip -d giftfinder/
          rm giftfinder/giftfinder-site.zip
          if [ ! -f giftfinder/index.html ]; then
            subdir=$(find giftfinder -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$subdir" ] && [ -f "$subdir/index.html" ]; then
              shopt -s dotglob
              mv "$subdir"/* giftfinder/
              rmdir "$subdir"
            fi
          fi
          test -f giftfinder/index.html
          ls giftfinder/
      - name: Commit extracted site and remove this workflow
        run: |
          rm -f .github/workflows/unzip-giftfinder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]$(printf '\100')users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Deploy Holiday Gift Finder into giftfinder/" || echo "nothing to commit"
          git push
