name: Unzip localtools redeploy
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip localtools zip
        run: |
          set -e
          mkdir -p /tmp/localtools
          unzip -o localtools/localtools-site.zip -d /tmp/localtools
          src=/tmp/localtools
          rm -rf localtools
          mkdir -p localtools
          if [ "$(find "$src" -mindepth 1 -maxdepth 1 | wc -l)" = "1" ] && [ -d "$(find "$src" -mindepth 1 -maxdepth 1)" ]; then
            cp -a "$(find "$src" -mindepth 1 -maxdepth 1)"/. localtools/
          else
            cp -a "$src"/. localtools/
          fi
          rm -f localtools/build_site.py
          rm -rf localtools/pack
          find localtools -maxdepth 1 -name '*.md' -delete
          rm -f localtools/localtools-site.zip
          ls localtools
      - name: Commit deployed files
        run: |
          git config user.name "hanxianqing"
          git config user.email "hanxianqing@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "Redeploy localtools from zip (exact key file bytes)"
          git push
      - name: Delete this workflow
        run: |
          git config user.name "hanxianqing"
          git config user.email "hanxianqing@users.noreply.github.com"
          git pull --rebase
          rm -f .github/workflows/unzip-localtools.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git add -A
          git commit -m "Remove unzip localtools workflow" || exit 0
          git push
