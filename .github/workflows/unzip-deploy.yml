name: Unzip site deployments
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site zips
        run: |
          set -e
          mkdir -p /tmp/merry /tmp/localtools /tmp/classroomkit /tmp/templatepack /tmp/pennymath
          unzip -o merry-printables-site.zip -d /tmp/merry
          unzip -o localtools/localtools-site.zip -d /tmp/localtools
          unzip -o classroomkit/classroomkit-site.zip -d /tmp/classroomkit
          unzip -o templatepack/templatepack-site.zip -d /tmp/templatepack
          unzip -o pennymath/pennymath-site.zip -d /tmp/pennymath
          deploy() {
            src="$1"; dest="$2"; keep="$3"
            if [ -d "$src" ]; then
              if [ "$keep" != "keep" ]; then rm -rf "$dest"; mkdir -p "$dest"; fi
              if [ "$(find "$src" -mindepth 1 -maxdepth 1 | wc -l)" = "1" ] && [ -d "$(find "$src" -mindepth 1 -maxdepth 1)" ]; then
                cp -a "$(find "$src" -mindepth 1 -maxdepth 1)"/. "$dest"/
              else
                cp -a "$src"/. "$dest"/
              fi
            fi
          }
          deploy /tmp/merry . keep
          deploy /tmp/localtools localtools
          deploy /tmp/classroomkit classroomkit
          deploy /tmp/templatepack templatepack
          deploy /tmp/pennymath pennymath
          rm -f build_site.py localtools/build_site.py classroomkit/build_site.py templatepack/build_site.py pennymath/build_site.py
          rm -rf pack localtools/pack classroomkit/pack templatepack/pack pennymath/pack
          find . -maxdepth 2 -name '*.md' -delete
          rm -f merry-printables-site.zip localtools/localtools-site.zip classroomkit/classroomkit-site.zip templatepack/templatepack-site.zip pennymath/pennymath-site.zip
          ls localtools classroomkit templatepack pennymath
      - name: Commit deployed files
        run: |
          git config user.name "hanxianqing"
          git config user.email "hanxianqing@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "Deploy 5 sites from zips (IndexNow key + Google verification)"
          git push
      - name: Delete this workflow
        run: |
          git config user.name "hanxianqing"
          git config user.email "hanxianqing@users.noreply.github.com"
          git pull --rebase
          rm -f .github/workflows/unzip-deploy.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git add -A
          git commit -m "Remove unzip deployment workflow" || exit 0
          git push
