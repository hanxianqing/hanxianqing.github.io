name: Unzip site deployments
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip sites
        run: |
          set -e
          deploy() {
            zip="$1"; dest="$2"; clean="$3"
            tmp=$(mktemp -d)
            unzip -o -q "$zip" -d "$tmp"
            top=$(find "$tmp" -mindepth 1 -maxdepth 1)
            if [ "$(echo "$top" | wc -l)" = "1" ] && [ -d "$top" ] && [ -f "$top/index.html" ]; then
              tmp="$top"
            fi
            if [ "$clean" = "clean" ]; then rm -rf "$dest"; fi
            mkdir -p "$dest"
            cp -a "$tmp"/. "$dest"/
          }
          deploy "merry-printables-site.zip" "." ""
          rm -f merry-printables-site.zip
          ls
      - name: Commit and self-delete
        run: |
          rm -f .github/workflows/unzip-deploy.yml
          git config user.name "hanxianqing"
          git config user.email "hanxianqing@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Redeploy Merry Printables from zip" || echo "nothing to commit"
          git push
