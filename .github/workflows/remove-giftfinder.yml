name: Remove giftfinder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove giftfinder folder
        run: rm -rf giftfinder
      - name: Commit deletion and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/remove-giftfinder.yml
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Remove giftfinder/ folder"
          git push
